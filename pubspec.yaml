name: yellow_connect
description: "Network utilities app: WireGuard VPN client, speed test, and public IP checker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Vendored with Swift Package Manager support (see packages/).
  wireguard_flutter:
    path: packages/wireguard_flutter
  flutter_internet_speed_test_pro:
    path: packages/flutter_internet_speed_test_pro
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/vpn/

